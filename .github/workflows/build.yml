name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'update.json'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'update.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      releaseName: ${{ steps.prepareArtifact.outputs.releaseName }}
      debugName: ${{ steps.prepareArtifact.outputs.debugName }}
      releaseSha256: ${{ steps.artifactSummary.outputs.releaseSha256 }}
      debugSha256: ${{ steps.artifactSummary.outputs.debugSha256 }}
      dexSha256: ${{ steps.artifactSummary.outputs.dexSha256 }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}
            ccache-${{ runner.os }}-
            ccache-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Clear module ZIP output directory
        run: rm -rf out

      - name: Build with Gradle
        run: |
          ./gradlew --parallel \
            testDebugUnitTest \
            assembleRelease \
            assembleDebug \
            verifyReleaseModuleContents \
            verifyDebugModuleContents \
            lintRelease \
            --stacktrace

      - name: Prepare artifact
        id: prepareArtifact
        run: |
          set -euo pipefail
          mapfile -t RELEASE_FILES < <(find out -maxdepth 1 -type f -name '*Release*.zip' | sort)
          mapfile -t DEBUG_FILES < <(find out -maxdepth 1 -type f -name '*Debug*.zip' | sort)

          if [[ ${#RELEASE_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 Release ZIP in out/; found ${#RELEASE_FILES[@]}"
            ls -la out/ || true
            exit 1
          fi
          if [[ ${#DEBUG_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 Debug ZIP in out/; found ${#DEBUG_FILES[@]}"
            ls -la out/ || true
            exit 1
          fi

          RELEASE_FILE="${RELEASE_FILES[0]}"
          DEBUG_FILE="${DEBUG_FILES[0]}"

          echo "releaseName=$(basename "$RELEASE_FILE" .zip)" >> "$GITHUB_OUTPUT"
          echo "debugName=$(basename "$DEBUG_FILE" .zip)" >> "$GITHUB_OUTPUT"
          echo "releaseFile=$RELEASE_FILE" >> "$GITHUB_OUTPUT"
          echo "debugFile=$DEBUG_FILE" >> "$GITHUB_OUTPUT"

      - name: Artifact summary
        id: artifactSummary
        run: |
          set -euo pipefail
          RELEASE_FILE="${{ steps.prepareArtifact.outputs.releaseFile }}"
          DEBUG_FILE="${{ steps.prepareArtifact.outputs.debugFile }}"

          RELEASE_SHA=$(sha256sum "$RELEASE_FILE" | awk '{print $1}')
          DEBUG_SHA=$(sha256sum "$DEBUG_FILE" | awk '{print $1}')
          DEX_SHA=$(unzip -p "$RELEASE_FILE" classes.dex | sha256sum | awk '{print $1}')

          echo "releaseSha256=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "debugSha256=$DEBUG_SHA" >> "$GITHUB_OUTPUT"
          echo "dexSha256=$DEX_SHA" >> "$GITHUB_OUTPUT"

          echo "## Artifact Hashes" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release ZIP**: \`${{ steps.prepareArtifact.outputs.releaseName }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release SHA256**: \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **classes.dex SHA256**: \`$DEX_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug ZIP**: \`${{ steps.prepareArtifact.outputs.debugName }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug SHA256**: \`$DEBUG_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.releaseName }}
          path: ${{ steps.prepareArtifact.outputs.releaseFile }}
          retention-days: 30
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.debugName }}
          path: ${{ steps.prepareArtifact.outputs.debugFile }}
          retention-days: 7
          archive: false

      - name: Upload release mappings
        uses: actions/upload-artifact@v7
        with:
          name: release-mappings-${{ github.run_number }}
          path: "./app/build/outputs/mapping/release"
          retention-days: 30
          compression-level: 9

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gates enforced**:" >> $GITHUB_STEP_SUMMARY
          echo "  - Unit tests (\`testDebugUnitTest\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - Release build (\`assembleRelease\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - Debug build (\`assembleDebug\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - Release module verification (\`verifyReleaseModuleContents\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - Debug module verification (\`verifyDebugModuleContents\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - Release lint (\`lintRelease\`)" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "- **Release Artifact**: ${{ steps.prepareArtifact.outputs.releaseName }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Debug Artifact**: ${{ steps.prepareArtifact.outputs.debugName }}" >> $GITHUB_STEP_SUMMARY
          fi

  dependency-submission:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6.3.0
