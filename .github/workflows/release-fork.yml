name: Fork Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must equal trickyStoreVersionName)
        required: true
        type: string
      prerelease:
        description: Mark release as prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: fork-draft-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse non-fork or non-main dispatch
        if: github.repository != 'xStoikk/TrickyStoreOSS' || github.ref != 'refs/heads/main'
        run: |
          echo "::error::Fork draft release may only run on xStoikk/TrickyStoreOSS refs/heads/main"
          exit 1

      - name: Validate tag syntax
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid release tag syntax: $TAG"
            exit 1
          fi

      - name: Check out dispatched main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.sha }}

      - name: Verify checked-out commit SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "$ACTUAL_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out SHA $ACTUAL_SHA != dispatched GITHUB_SHA $GITHUB_SHA"
            exit 1
          fi
          echo "RELEASE_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Validate tag matches product version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PRODUCT_VERSION=$(grep -E '^trickyStoreVersionName=' gradle.properties | cut -d= -f2- | tr -d '\r')
          if [[ -z "$PRODUCT_VERSION" ]]; then
            echo "::error::trickyStoreVersionName missing from gradle.properties"
            exit 1
          fi
          if [[ "$TAG" != "$PRODUCT_VERSION" ]]; then
            echo "::error::Release tag '$TAG' does not match trickyStoreVersionName '$PRODUCT_VERSION'"
            exit 1
          fi
          echo "productVersion=$PRODUCT_VERSION" >> "$GITHUB_ENV"

      - name: Fail if remote tag already exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          RC=$?
          set -e
          case "$RC" in
            0)
              echo "::error::Remote Git tag already exists: $TAG"
              exit 1
              ;;
            2)
              echo "Remote tag not found: $TAG"
              ;;
            *)
              echo "::error::Remote tag lookup failed for $TAG (git ls-remote exit code $RC)"
              exit 1
              ;;
          esac

      - name: Fail if GitHub Release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS \
            -o /tmp/release-check.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$STATUS" in
            200)
              echo "::error::GitHub Release already exists for tag: $TAG"
              exit 1
              ;;
            404)
              echo "No existing GitHub Release for tag: $TAG"
              ;;
            *)
              echo "::error::GitHub Release lookup failed for tag $TAG (HTTP $STATUS)"
              cat /tmp/release-check.json || true
              exit 1
              ;;
          esac

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Verify clean release checkout
        run: |
          set -euo pipefail
          STATUS=$(git status --porcelain --untracked-files=all)
          if [[ -n "$STATUS" ]]; then
            echo "::error::Release checkout is not clean before preparation"
            printf '%s\n' "$STATUS"
            exit 1
          fi

      - name: Prepare release metadata and artifacts
        env:
          TAG: ${{ inputs.tag }}
        run: pwsh ./scripts/prepare-release.ps1 -Tag "$TAG"

      - name: Verify release-prep manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          MANIFEST=out/release-prep/release-manifest.json
          test -f "$MANIFEST"

          SCHEMA=$(jq -r '.schemaVersion' "$MANIFEST")
          REPO=$(jq -r '.repository' "$MANIFEST")
          COMMIT=$(jq -r '.commit' "$MANIFEST")
          PRODUCT=$(jq -r '.productVersion' "$MANIFEST")
          RELEASE_TAG=$(jq -r '.releaseTag // empty' "$MANIFEST")
          STRATEGY=$(jq -r '.versionCodeStrategy' "$MANIFEST")
          EPOCH=$(jq -r '.versionCodeEpoch' "$MANIFEST")
          UPDATE_JSON=$(jq -r '.packagedUpdateJson' "$MANIFEST")
          RELEASE_ZIP=$(jq -r '.releaseZip' "$MANIFEST")

          FORK_FEED='https://raw.githubusercontent.com/xStoikk/TrickyStoreOSS/main/update.json'

          [[ "$SCHEMA" == "2" ]] || { echo "::error::schemaVersion must be 2"; exit 1; }
          [[ "$REPO" == "xStoikk/TrickyStoreOSS" ]] || { echo "::error::repository mismatch"; exit 1; }
          [[ "$COMMIT" == "$RELEASE_SHA" ]] || { echo "::error::manifest commit $COMMIT != RELEASE_SHA $RELEASE_SHA"; exit 1; }
          [[ "$PRODUCT" == "$TAG" ]] || { echo "::error::productVersion mismatch"; exit 1; }
          [[ "$RELEASE_TAG" == "$TAG" ]] || { echo "::error::releaseTag mismatch"; exit 1; }
          [[ "$STRATEGY" == "epoch+commitCount" ]] || { echo "::error::versionCodeStrategy mismatch"; exit 1; }
          [[ "$EPOCH" == "100000" ]] || { echo "::error::versionCodeEpoch must be 100000"; exit 1; }
          [[ "$UPDATE_JSON" == "$FORK_FEED" ]] || { echo "::error::packagedUpdateJson mismatch"; exit 1; }
          [[ -f "out/$RELEASE_ZIP" ]] || { echo "::error::Release ZIP missing: out/$RELEASE_ZIP"; exit 1; }

          NOTES=out/release-prep/release-notes.md
          if [[ ! -s "$NOTES" ]]; then
            echo "::error::release-notes.md missing or empty"
            exit 1
          fi
          if grep -qi 'Do not publish' "$NOTES"; then
            echo "::error::release-notes.md contains publication-gate wording: Do not publish"
            exit 1
          fi
          if grep -qi 'not published' "$NOTES"; then
            echo "::error::release-notes.md contains publication-gate wording: not published"
            exit 1
          fi
          if grep -qi 'update feed has not yet been committed' "$NOTES"; then
            echo "::error::release-notes.md contains publication-gate wording: update feed has not yet been committed"
            exit 1
          fi
          if grep -qi '^DRAFT' "$NOTES"; then
            echo "::error::release-notes.md begins with draft banner token"
            exit 1
          fi

          echo "releaseZip=$RELEASE_ZIP" >> "$GITHUB_OUTPUT"
        id: manifest

      - name: Attest Release ZIP
        uses: actions/attest@v4
        with:
          subject-path: out/${{ steps.manifest.outputs.releaseZip }}
          subject-name: ${{ inputs.tag }}

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ZIP: ${{ steps.manifest.outputs.releaseZip }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --draft \
            $PRERELEASE_FLAG \
            --notes-file out/release-prep/release-notes.md \
            "out/$RELEASE_ZIP" \
            out/release-prep/release-manifest.json \
            out/release-prep/update.json.next \
            out/release-prep/release-summary.md

      - name: Draft release summary
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_ZIP: ${{ steps.manifest.outputs.releaseZip }}
        run: |
          set -euo pipefail
          {
            echo "## Draft release created"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Attached Release ZIP: \`$RELEASE_ZIP\`"
            echo "- update.json.next attached but not committed automatically"
            echo
            echo "### PUBLICATION GATE"
            echo
            echo "Do not publish until update.json/changelog metadata has been merged to protected main and verified."
          } >> "$GITHUB_STEP_SUMMARY"
